name: CI Qualification

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

# Only superseded attempts for the same PR are cancelled. Distinct master
# commits keep independent groups so each merged commit remains qualified.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  discovery:
    runs-on: ubuntu-latest
    outputs:
      cargo_manifests: ${{ steps.discover.outputs.cargo_manifests }}
      package_jsons: ${{ steps.discover.outputs.package_jsons }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Stale Base Merge
        if: github.event_name == 'pull_request'
        run: |
          PR_HEAD=${{ github.event.pull_request.head.sha }}
          TARGET_HEAD=$(git rev-parse origin/master)
          MERGE_BASE=$(git merge-base $PR_HEAD $TARGET_HEAD)

          if [ "$MERGE_BASE" != "$TARGET_HEAD" ]; then
            echo "::error::PR is stale. Please rebase or merge from master."
            exit 1
          fi

      - name: Discover Manifests & Detect Orphan Tests
        id: discover
        run: |
          python3 -m unittest discover -s scripts/ci/tests -v
          ./scripts/ci/discover.py

      - name: Report PR Deletions
        if: github.event_name == 'pull_request'
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --diff-filter=D --name-only "origin/master...$PR_HEAD" > deleted-files.txt
          if [ -s deleted-files.txt ]; then
            echo '::notice::The PR deletes files; review the listed changes.'
            cat deleted-files.txt
          fi

  validation:
    runs-on: ubuntu-latest
    needs: discovery
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Audit Unsafe Code
        run: ./scripts/ci/audit_unsafe.sh
      - name: Check Mock Bypasses
        run: ./scripts/ci/check_mock_bypasses.sh

  dependency-lane:
    runs-on: ubuntu-latest
    needs: [discovery, validation]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enforce Authoritative Dependency Lock Strategy
        run: |
          if [ ! -f Cargo.lock ]; then
            echo "::error::Cargo.lock is missing at the top level."
            exit 1
          fi

          echo '${{ needs.discovery.outputs.package_jsons }}' > package_jsons.json
          PACKAGE_JSONS=$(jq -r '.[]' package_jsons.json)
          for pkg in $PACKAGE_JSONS; do
            DIR=$(dirname "$pkg")
            if [ ! -f "$DIR/package-lock.json" ]; then
              echo "::error::package-lock.json is missing in $DIR/."
              exit 1
            fi
          done

  compile-and-unit-cargo:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [discovery, dependency-lane]
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        manifest: ${{ fromJson(needs.discovery.outputs.cargo_manifests) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.manifest }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.manifest }}-
            ${{ runner.os }}-cargo-

      - name: Compile
        run: |
          set -o pipefail
          args=(--manifest-path "$MANIFEST")
          if [ "$MANIFEST" = "Cargo.toml" ]; then args+=(--workspace); fi
          cargo build "${args[@]}" 2>&1 | tee compile.log
        env:
          CARGO_TERM_COLOR: always
          MANIFEST: ${{ matrix.manifest }}

      - name: Check Formatting
        run: |
          if [ "${{ matrix.manifest }}" = "Cargo.toml" ]; then
            cargo fmt --all --manifest-path Cargo.toml -- --check
          else
            cargo fmt --manifest-path ${{ matrix.manifest }} -- --check
          fi

      - name: Run Clippy
        env:
          MANIFEST: ${{ matrix.manifest }}
        run: |
          args=(--manifest-path "$MANIFEST")
          if [ "$MANIFEST" = "Cargo.toml" ]; then args+=(--workspace); fi
          cargo clippy "${args[@]}" -- -D warnings

      - name: Run Tests
        id: test
        run: |
          set -o pipefail
          args=(--manifest-path "$MANIFEST")
          if [ "$MANIFEST" = "Cargo.toml" ]; then args+=(--workspace); fi
          cargo test "${args[@]}" 2>&1 | tee test.log
        env:
          CARGO_TERM_COLOR: always
          MANIFEST: ${{ matrix.manifest }}

      # Each member was an individual matrix check; keep its zero-test guard.
      - name: Check Workspace Member Test Counts
        if: matrix.manifest == 'Cargo.toml'
        run: |
          set -o pipefail
          python3 scripts/ci/discover.py --root-workspace-members > workspace-members.txt
          while IFS= read -r member; do
            echo "Checking tests for $member"
            cargo test --manifest-path "$member" 2>&1 | tee member-test.log
            passed=$( (grep -o -E '[0-9]+ passed' member-test.log || true) | awk '{sum += $1} END {print sum+0}')
            failed=$( (grep -o -E '[0-9]+ failed' member-test.log || true) | awk '{sum += $1} END {print sum+0}')
            if [ "$failed" -gt 0 ] || [ "$passed" -eq 0 ]; then
              echo "::error::Workspace member has failing or zero tests: $member"
              exit 1
            fi
          done < workspace-members.txt

      - name: Enforce Zero-Test Success
        run: |
          PASSED_COUNT=$(grep -o -E '[0-9]+ passed' test.log | awk '{sum += $1} END {print sum+0}')
          FAILED_COUNT=$(grep -o -E '[0-9]+ failed' test.log | awk '{sum += $1} END {print sum+0}')
          if [ "$FAILED_COUNT" -gt 0 ]; then
            echo "::error::Tests failed in ${{ matrix.manifest }} ($FAILED_COUNT failures)."
            exit 1
          fi
          if [ "$PASSED_COUNT" -eq 0 ]; then
            echo "::error::Zero-test success detected in ${{ matrix.manifest }}. Tests are mandatory."
            exit 1
          fi

      - name: Status Report
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "PASS: ${{ matrix.manifest }}"
          elif [ "${{ job.status }}" == "failure" ]; then
            echo "FAIL: ${{ matrix.manifest }}"
          else
            echo "NOT_RUN/BLOCKED: ${{ matrix.manifest }}"
          fi

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-cargo-${{ strategy.job-index }}
          path: |
            compile.log
            test.log
            member-test.log

  compile-and-unit-npm:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [discovery, dependency-lane]
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        manifest: ${{ fromJson(needs.discovery.outputs.package_jsons) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rust Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.manifest }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.manifest }}-
            ${{ runner.os }}-cargo-

      - name: Compile and Test
        env:
          MANIFEST: ${{ matrix.manifest }}
        run: |
          set -o pipefail
          DIR=$(dirname "$MANIFEST")
          LOG_DIR=$(pwd)

          cd "$DIR"
          npm ci
          if [ "$MANIFEST" = "tests/e2e/browser/package.json" ]; then
            # The Playwright suite is JavaScript and has no build script.
            find . -type f -name '*.js' -not -path './node_modules/*' -print0 |
              while IFS= read -r -d '' file; do node --check "$file" || exit $?; done 2>&1 | tee "$LOG_DIR/compile.log"
          else
            npm run build 2>&1 | tee "$LOG_DIR/compile.log"
          fi
          npm test 2>&1 | tee "$LOG_DIR/test.log"

          if grep -q "Tests:.*0 total" "$LOG_DIR/test.log"; then
            echo "::error::Zero-test success detected in $MANIFEST. Tests are mandatory."
            exit 1
          fi

      - name: Status Report
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "PASS: ${{ matrix.manifest }}"
          elif [ "${{ job.status }}" == "failure" ]; then
            echo "FAIL: ${{ matrix.manifest }}"
          else
            echo "NOT_RUN/BLOCKED: ${{ matrix.manifest }}"
          fi

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-npm-${{ strategy.job-index }}
          path: |
            compile.log
            test.log
