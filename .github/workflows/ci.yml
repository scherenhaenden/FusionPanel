name: CI Qualification

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  discovery:
    runs-on: ubuntu-latest
    outputs:
      cargo_manifests: ${{ steps.discover.outputs.cargo_manifests }}
      package_jsons: ${{ steps.discover.outputs.package_jsons }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Stale Base Merge
        if: github.event_name == 'pull_request'
        run: |
          PR_HEAD=${{ github.event.pull_request.head.sha }}
          TARGET_HEAD=$(git rev-parse origin/master)
          MERGE_BASE=$(git merge-base $PR_HEAD $TARGET_HEAD)

          if [ "$MERGE_BASE" != "$TARGET_HEAD" ]; then
            echo "::error::PR is stale. Please rebase or merge from master."
            exit 1
          fi

      - name: Discover Manifests & Detect Orphan Tests
        id: discover
        run: ./scripts/ci/discover.py

      - name: Detect Dropped Files
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            DROPPED_FILES=$(git diff --name-status origin/master...${{ github.event.pull_request.head.sha }} | awk '$1 == "D" {print $2}')
            if [ -n "$DROPPED_FILES" ]; then
              echo "::error::Dropped files detected: $DROPPED_FILES"
              exit 1
            fi
          fi

  dependency-lane:
    runs-on: ubuntu-latest
    needs: discovery
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enforce Authoritative Dependency Lock Strategy
        run: |
          if [ ! -f Cargo.lock ]; then
            echo "::error::Cargo.lock is missing at the top level."
            exit 1
          fi

          echo '${{ needs.discovery.outputs.package_jsons }}' > package_jsons.json
          PACKAGE_JSONS=$(jq -r '.[]' package_jsons.json)
          for pkg in $PACKAGE_JSONS; do
            DIR=$(dirname "$pkg")
            if [ ! -f "$DIR/package-lock.json" ]; then
              echo "::error::package-lock.json is missing in $DIR/."
              exit 1
            fi
          done

  compile-and-unit-cargo:
    runs-on: ubuntu-latest
    needs: [discovery, dependency-lane]
    strategy:
      fail-fast: false
      matrix:
        manifest: ${{ fromJson(needs.discovery.outputs.cargo_manifests) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Compile
        run: cargo build --manifest-path ${{ matrix.manifest }} 2>&1 | tee compile.log
        env:
          CARGO_TERM_COLOR: always

      - name: Run Tests
        id: test
        run: |
          cargo test --manifest-path ${{ matrix.manifest }} 2>&1 | tee test.log
        env:
          CARGO_TERM_COLOR: always

      - name: Enforce Zero-Test Success
        run: |
          if grep -q "0 passed; 0 failed" test.log; then
            echo "::error::Zero-test success detected in ${{ matrix.manifest }}. Tests are mandatory."
            exit 1
          fi

      - name: Status Report
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "PASS: ${{ matrix.manifest }}"
          elif [ "${{ job.status }}" == "failure" ]; then
            echo "FAIL: ${{ matrix.manifest }}"
          else
            echo "NOT_RUN/BLOCKED: ${{ matrix.manifest }}"
          fi

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-cargo-${{ strategy.job-index }}
          path: |
            compile.log
            test.log

  compile-and-unit-npm:
    runs-on: ubuntu-latest
    needs: [discovery, dependency-lane]
    strategy:
      fail-fast: false
      matrix:
        manifest: ${{ fromJson(needs.discovery.outputs.package_jsons) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compile and Test
        run: |
          DIR=$(dirname ${{ matrix.manifest }})
          LOG_DIR=$(pwd)

          cd "$DIR"
          npm ci
          npm run build 2>&1 | tee "$LOG_DIR/compile.log"
          npm test 2>&1 | tee "$LOG_DIR/test.log"

          if grep -q "Tests:.*0 total" "$LOG_DIR/test.log"; then
            echo "::error::Zero-test success detected in ${{ matrix.manifest }}. Tests are mandatory."
            exit 1
          fi

      - name: Status Report
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "PASS: ${{ matrix.manifest }}"
          elif [ "${{ job.status }}" == "failure" ]; then
            echo "FAIL: ${{ matrix.manifest }}"
          else
            echo "NOT_RUN/BLOCKED: ${{ matrix.manifest }}"
          fi

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-npm-${{ strategy.job-index }}
          path: |
            compile.log
            test.log
