[workspace]

[package]
name = "agent"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"
hmac = "0.12"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
hex = "0.4"
tempfile = "3"

[dev-dependencies]
tempfile = "3"
