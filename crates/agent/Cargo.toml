[workspace]

[package]
name = "agent"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[dependencies]
fusionpanel-agent-protocol = { path = "../agent-protocol" }
databases = { path = "../../modules/databases" }
hosting = { path = "../../modules/hosting" }
uuid = { version = "1.10.0", features = ["v4", "serde"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.21", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
futures-util = "0.3"
hmac = "0.12"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
async-trait = "0.1"
hex = "0.4"
tempfile = "3"
ring = "0.17"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
