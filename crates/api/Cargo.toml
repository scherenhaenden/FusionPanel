[package]
name = "fusionpanel-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
axum = "0.8.9"
chrono = "0.4"
fusionpanel-control-store = { path = "../control-store" }
identity = { path = "../../modules/identity" }
integration-identity = { path = "../../integration/identity" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
subtle = "2.6.1"
tokio = { version = "1.54.1", features = ["full"] }
tower-cookies = "0.11"

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.10"
tower = { version = "0.5.3", features = ["util"] }
