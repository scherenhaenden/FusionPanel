[package]
name = "fusionpanel-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "macros", "rt-multi-thread"] }
identity = { git = "file:///app", package = "identity" }
uuid = { version = "1.0", features = ["v4"] }
rand = "0.8"
fusionpanel-domain = { path = "../domain" }

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"
