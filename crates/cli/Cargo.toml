[package]
name = "fusionpanel-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "macros", "rt-multi-thread"] }
rand = "0.8.5"
identity = { path = "../../modules/identity" }
fusionpanel-domain = { path = "../domain" }
fusionpanel-control-store = { path = "../control-store" }

[dev-dependencies]
wiremock = "0.6.5"
tempfile = "3.10.1"
