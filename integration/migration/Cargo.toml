[package]
name = "integration_migration"
version = "0.1.0"
edition = "2021"

[dependencies]
migration = { path = "../../modules/migration" }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
anyhow = "1.0"

[dev-dependencies]
reqwest = { version = "0.11", features = ["json"] }
tempfile = "3.2"

[package.metadata.fusionpanel]
policy = "compile-only"

