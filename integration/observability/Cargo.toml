[package]
name = "observability-integration"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[workspace]

[dependencies]
observability = { path = "../../modules/observability" }
axum = "0.7.9"
tokio = { version = "1.37.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12.28", features = ["json", "rustls-tls"], default-features = false }
rusqlite = { version = "0.31.0", features = ["bundled"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }
prometheus = "0.13.4"
tower-http = { version = "0.6.11", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
