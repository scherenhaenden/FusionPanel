[package]
name = "administration"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[workspace]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
thiserror = "1.0"
subtle = "2.6"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3.12"
tokio = { version = "1", features = ["full"] }
