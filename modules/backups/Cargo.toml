[workspace]

[package]
name = "backups"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"
flate2 = "1.0"
hex = "0.4"
thiserror = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = "0.4.45"

[dev-dependencies]
tempfile = "3.27.0"
