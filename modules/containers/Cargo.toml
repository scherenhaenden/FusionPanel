[workspace]

[package]
name = "containers"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[dependencies]
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
async-trait = "0.1"
tokio = { version = "1", features = ["process", "time"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1", features = ["full"] }
