[workspace]

[package]
name = "databases"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
thiserror = "1.0"
async-trait = "0.1"
tokio = { version = "1.0", features = ["full"] }
regex = "1.10"
once_cell = "1.21.4"

[dev-dependencies]
tokio-test = "0.4"
