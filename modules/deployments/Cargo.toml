[package]
name = "deployments"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[workspace]

[dependencies]
uuid = { version = "1.8", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
subtle = "2.5"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3"
