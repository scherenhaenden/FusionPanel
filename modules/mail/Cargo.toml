[workspace]

[package]
name = "mail"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[dependencies]
regex = "1.13.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.10"
