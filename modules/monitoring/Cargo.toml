[package]
name = "monitoring"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[workspace]

[dependencies]
uuid = { version = "1.7.0", features = ["v4"] }
chrono = { version = "0.4.34" }
serde = { version = "1.0", features = ["derive"] }
sysinfo = "0.30"
hmac = "0.13.0"
sha2 = "0.11.1"

[dev-dependencies]
tempfile = "3"
