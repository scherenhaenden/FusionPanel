[package]
name = "secrets"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[workspace]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
uuid = { version = "1.10", features = ["v4"] }

rand = "0.8"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
hex = "0.4.3"
aes-gcm = "0.10"

[dev-dependencies]
tempfile = "3.27.0"
