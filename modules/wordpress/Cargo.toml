[workspace]

[package]
name = "wordpress"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["process", "time", "macros", "rt-multi-thread"] }
thiserror = "1.0"
uuid = { version = "1.8", features = ["v4"] }

[dev-dependencies]
tokio-test = "0.4"
