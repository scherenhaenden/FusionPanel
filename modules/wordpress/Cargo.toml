[package]
name = "fusionpanel-wordpress"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[workspace]

[dependencies]
tokio = { version = "1.37.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "stream"] }
thiserror = "1.0"
sha1 = "0.10"
hex = "0.4"
rand = "0.8"
base64 = "0.22"
futures-util = "0.3"
mysql_async = "0.34.1"
urlencoding = "2.1"
tempfile = "3.10"
zip = { version = "0.6", default-features = false, features = ["deflate", "time"] }

[dev-dependencies]
tokio-test = "0.4"
