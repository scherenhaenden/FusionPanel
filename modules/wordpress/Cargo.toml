[workspace]

[package]
name = "wordpress"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[dependencies]
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }

[dev-dependencies]
mockito = "1.2"
