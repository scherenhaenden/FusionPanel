[package]
name = "updater"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[workspace]

[dependencies]
reqwest = { version = "0.11", features = ["blocking"] }
ed25519-dalek = { version = "2.0", features = ["rand_core"] }
rand = "0.8"
thiserror = "1.0"

[dev-dependencies]
tempfile = "3"
mockito = "1.0"

[[test]]
name = "unit_updater"
path = "../tests/unit_updater.rs"
