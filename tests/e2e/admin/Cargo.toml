[workspace]

[package]
name = "e2e-admin"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-only"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1.0"
tokio = { version = "1.14", features = ["full"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
tempfile = "3.12"
