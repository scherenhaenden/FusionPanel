[workspace]

[package]
name = "e2e-administration"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-only"

[dependencies]
administration = { path = "../../../modules/administration" }
integration-administration = { path = "../../../integration/administration" }
release-integration = { path = "../../../scripts/release" }
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
tempfile = "3.12"
