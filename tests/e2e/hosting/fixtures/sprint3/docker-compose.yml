x-sprint3-logging: &sprint3-logging
  driver: local
  options:
    max-size: "2m"
    max-file: "1"

services:
  api:
    image: "${FUSIONPANEL_S3_API_IMAGE:?set unique API fixture image tag}"
    build:
      context: "${FUSIONPANEL_S3_API_BUILD_CONTEXT:?set narrow API build context}"
      dockerfile: Dockerfile
    init: true
    read_only: true
    user: "${FUSIONPANEL_S3_UID:?set fixture UID}:${FUSIONPANEL_S3_GID:?set fixture GID}"
    network_mode: service:node
    depends_on:
      node:
        condition: service_started
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
      - /state:rw,noexec,nosuid,nodev,size=64m,uid=${FUSIONPANEL_S3_UID:?set fixture UID},gid=${FUSIONPANEL_S3_GID:?set fixture GID},mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 0.50
    pids_limit: 128
    environment:
      FUSIONPANEL_ADMIN_TOKEN: "${FUSIONPANEL_E2E_ADMIN_TOKEN:?set ephemeral admin token}"
      FUSIONPANEL_DATABASE_URL: /state/fusionpanel.db
      FUSIONPANEL_E2E_USERNAME: "${FUSIONPANEL_E2E_USERNAME:-e2e-admin}"
      FUSIONPANEL_E2E_PASSWORD: "${FUSIONPANEL_E2E_PASSWORD:?set synthetic fixture password}"
      FUSIONPANEL_FRONTEND_DIR: /app/frontend
      FUSIONPANEL_LISTEN: 0.0.0.0:8080
    volumes:
      - "${FUSIONPANEL_S3_REPO_ROOT}/target/debug/fusionpanel-api:/usr/local/bin/fusionpanel-api:ro"
      - "${FUSIONPANEL_S3_REPO_ROOT}/target/debug/fusionpanel-cli:/usr/local/bin/fusionpanel-cli:ro"
      - "${FUSIONPANEL_S3_REPO_ROOT}/frontend/dist:/app/frontend:ro"
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/fusionpanel-cli
        - --server
        - http://127.0.0.1:8080
        - health
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 10s
    logging: *sprint3-logging

  node:
    image: "${FUSIONPANEL_S3_NODE_IMAGE:?set unique node fixture image tag}"
    build:
      context: "${FUSIONPANEL_S3_NODE_BUILD_CONTEXT:?set narrow node build context}"
      dockerfile: Dockerfile
    init: true
    read_only: true
    user: "0:2000"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=0,gid=0,mode=0700
      - /run:rw,noexec,nosuid,nodev,size=8m,uid=0,gid=2000,mode=0750
      - /etc/nginx/fusionpanel:rw,noexec,nosuid,nodev,size=16m,uid=0,gid=0,mode=0750
      - /var/cache/nginx:rw,noexec,nosuid,nodev,size=16m,uid=33,gid=33,mode=0700
      - /var/lib/nginx:rw,noexec,nosuid,nodev,size=16m,uid=33,gid=33,mode=0700
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.00
    pids_limit: 192
    ports:
      - "127.0.0.1::80"
      - "127.0.0.1::8080"
    depends_on:
      upstream:
        condition: service_healthy
    environment:
      FUSIONPANEL_AGENT_MODE: http
      FUSIONPANEL_API_URL: http://127.0.0.1:8080
      FUSIONPANEL_ADMIN_TOKEN: "${FUSIONPANEL_E2E_ADMIN_TOKEN}"
      FUSIONPANEL_NODE_NAME: "sprint3-${FUSIONPANEL_S3_PROJECT_SUFFIX:?set fixture project suffix}"
      FUSIONPANEL_NGINX_CONFIG: /etc/nginx/nginx.conf
      FUSIONPANEL_NGINX_MANAGED_ROOT: /etc/nginx/fusionpanel
      FUSIONPANEL_S3_AGENT_UID: "2001"
      FUSIONPANEL_S3_AGENT_GID: "2001"
      FUSIONPANEL_NGINX_HELPER_SOCKET: /run/fusionpanel-nginx/nginx-helper.sock
    volumes:
      - "${FUSIONPANEL_S3_REPO_ROOT}/target/debug/fusionpanel-agent:/usr/local/bin/fusionpanel-agent:ro"
      - "${FUSIONPANEL_S3_REPO_ROOT}/target/debug/fusionpanel-nginx-helper:/usr/local/bin/fusionpanel-nginx-helper:ro"
      - "${FUSIONPANEL_S3_STATE_DIR}/sites:/srv/fusionpanel/sites:ro"
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./invalid-upstream.conf:/etc/nginx/fixture-invalid-upstream.conf:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -S /run/fusionpanel-nginx/nginx-helper.sock
          && test "$(stat -c '%u:%g:%a' /run/fusionpanel-nginx/nginx-helper.sock)" = '0:2000:660'
          && test -s /run/fusionpanel-nginx-helper.pid
          && kill -0 "$$(cat /run/fusionpanel-nginx-helper.pid)"
          && test -s /run/fusionpanel-agent.pid
          && agent_pid="$$(cat /run/fusionpanel-agent.pid)"
          && awk -v uid="$${FUSIONPANEL_S3_AGENT_UID}" '$$1 == "Uid:" { exit !($$2 == uid) }' "/proc/$${agent_pid}/status"
          && awk -v gid="$${FUSIONPANEL_S3_AGENT_GID}" '$$1 == "Gid:" { exit !($$2 == gid) }' "/proc/$${agent_pid}/status"
          && awk '$$1 ~ /^Cap(Eff|Prm|Inh|Amb):$$/ { seen++; if ($$2 !~ /^0+$$/) exit 1 } END { exit !(seen == 4) }' "/proc/$${agent_pid}/status"
          && awk '$$1 == "NoNewPrivs:" { exit !($$2 == 1) }' "/proc/$${agent_pid}/status"
          && setpriv --reuid="$${FUSIONPANEL_S3_AGENT_UID}" --regid="$${FUSIONPANEL_S3_AGENT_GID}" --groups=2000 --no-new-privs -- test ! -w /etc/nginx/fusionpanel
          && test -s /run/nginx.pid
          && kill -0 "$$(cat /run/nginx.pid)"
          && nginx -t -q -c /etc/nginx/nginx.conf
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    logging: *sprint3-logging

  upstream:
    image: nginx:alpine@sha256:785835ea65db4bba6f021acc0f3be91b0fef76a53fe41f8588c6698d2aed0606
    read_only: true
    cap_drop:
      - ALL
    entrypoint: [nginx]
    command: [-g, "daemon off;", -c, /etc/nginx/upstream.conf]
    user: "65532:65532"
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    memswap_limit: 64m
    cpus: 0.25
    pids_limit: 64
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=4m,uid=65532,gid=65532,mode=0700
      - /var/cache/nginx:rw,noexec,nosuid,nodev,size=8m,uid=65532,gid=65532,mode=0700
    volumes:
      - ./upstream.conf:/etc/nginx/upstream.conf:ro
      - ./upstream/index.html:/usr/share/nginx/html/index.html:ro
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8080/"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 3s
    networks:
      default:
        aliases:
          - upstream.sprint3.test
    logging: *sprint3-logging
