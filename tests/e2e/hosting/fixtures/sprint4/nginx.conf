user www-data;
worker_processes 1;
pid /run/nginx.pid;
lock_file /tmp/nginx.lock;
error_log stderr warn;

events {
    worker_connections 128;
}

http {
    access_log off;

    server {
        listen 80 default_server;
        server_name _;
        return 404;
    }

    server {
        listen 80;
        server_name unrelated.sprint3.test;
        return 200 "unrelated-vhost-marker";
    }

    include /etc/nginx/fusionpanel/sites-enabled/*.conf;
}
