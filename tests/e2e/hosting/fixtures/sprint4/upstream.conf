worker_processes 1;
pid /tmp/nginx.pid;
lock_file /tmp/nginx.lock;
error_log stderr warn;

events {
    worker_connections 64;
}

http {
    access_log off;

    server {
        listen 8080 default_server;
        server_name _;

        location / {
            root /usr/share/nginx/html;
            try_files /index.html =404;
        }
    }
}
