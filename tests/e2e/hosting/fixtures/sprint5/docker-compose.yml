x-sprint5-logging: &sprint5-logging
  driver: local
  options:
    max-size: "2m"
    max-file: "2"

services:
  postgres:
    image: postgres:15-alpine
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.50
    pids_limit: 128
    environment:
      POSTGRES_PASSWORD: "${FUSIONPANEL_PG_PASSWORD:-e2e-pg-admin}"
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    logging: *sprint5-logging

  mariadb:
    image: mariadb:11.4
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.50
    pids_limit: 128
    environment:
      MARIADB_ROOT_PASSWORD: "${FUSIONPANEL_MARIADB_PASSWORD:-e2e-mariadb-admin}"
    ports:
      - "127.0.0.1::3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
    logging: *sprint5-logging

  api:
    image: "${FUSIONPANEL_S5_API_IMAGE:?set API image}"
    build:
      context: "${FUSIONPANEL_S5_API_BUILD_CONTEXT:?set API context}"
      dockerfile: Dockerfile
    init: true
    read_only: true
    user: "${FUSIONPANEL_S5_UID:?set UID}:${FUSIONPANEL_S5_GID:?set GID}"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
      - /state:rw,noexec,nosuid,nodev,size=64m,uid=${FUSIONPANEL_S5_UID:?set UID},gid=${FUSIONPANEL_S5_GID:?set GID},mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 0.50
    pids_limit: 128
    ports:
      - "127.0.0.1::8080"
    environment:
      FUSIONPANEL_ADMIN_TOKEN: "${FUSIONPANEL_E2E_ADMIN_TOKEN:?set admin token}"
      FUSIONPANEL_DATABASE_URL: /state/fusionpanel.db
      FUSIONPANEL_E2E_USERNAME: "${FUSIONPANEL_E2E_USERNAME:-e2e-admin}"
      FUSIONPANEL_E2E_PASSWORD: "${FUSIONPANEL_E2E_PASSWORD:?set password}"
      FUSIONPANEL_FRONTEND_DIR: /app/frontend
      FUSIONPANEL_LISTEN: 0.0.0.0:8080
      FUSIONPANEL_PG_PUBLIC_HOST: postgres
      FUSIONPANEL_MARIADB_PUBLIC_HOST: mariadb
    volumes:
      - "${FUSIONPANEL_S5_REPO_ROOT}/target/debug/fusionpanel-api:/usr/local/bin/fusionpanel-api:ro"
      - "${FUSIONPANEL_S5_REPO_ROOT}/target/debug/fusionpanel-cli:/usr/local/bin/fusionpanel-cli:ro"
      - "${FUSIONPANEL_S5_REPO_ROOT}/frontend/dist:/app/frontend:ro"
    healthcheck:
      test: ["CMD", "/usr/local/bin/fusionpanel-cli", "--server", "http://127.0.0.1:8080", "health"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    logging: *sprint5-logging

  node:
    image: "${FUSIONPANEL_S5_NODE_IMAGE:?set node image}"
    build:
      context: "${FUSIONPANEL_S5_NODE_BUILD_CONTEXT:?set node context}"
      dockerfile: Dockerfile
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.50
    pids_limit: 128
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mariadb:
        condition: service_healthy
    environment:
      FUSIONPANEL_AGENT_MODE: http
      FUSIONPANEL_API_URL: http://api:8080
      FUSIONPANEL_ADMIN_TOKEN: "${FUSIONPANEL_E2E_ADMIN_TOKEN}"
      FUSIONPANEL_NODE_NAME: "sprint5-${FUSIONPANEL_S5_SUFFIX:?set suffix}"
      FUSIONPANEL_PG_HOST: postgres
      FUSIONPANEL_PG_PORT: "5432"
      FUSIONPANEL_PG_USER: postgres
      FUSIONPANEL_PG_PASSWORD: "${FUSIONPANEL_PG_PASSWORD:-e2e-pg-admin}"
      FUSIONPANEL_MARIADB_HOST: mariadb
      FUSIONPANEL_MARIADB_PORT: "3306"
      FUSIONPANEL_MARIADB_USER: root
      FUSIONPANEL_MARIADB_PASSWORD: "${FUSIONPANEL_MARIADB_PASSWORD:-e2e-mariadb-admin}"
    volumes:
      - "${FUSIONPANEL_S5_REPO_ROOT}/crates/agent/target/debug/fusionpanel-agent:/usr/local/bin/fusionpanel-agent:ro"
    entrypoint: ["/usr/local/bin/fusionpanel-agent"]
    logging: *sprint5-logging
