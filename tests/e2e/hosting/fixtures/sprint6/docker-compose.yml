x-sprint6-logging: &sprint6-logging
  driver: local
  options:
    max-size: "2m"
    max-file: "2"

services:
  postgres:
    image: postgres:15-alpine
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.50
    pids_limit: 128
    environment:
      POSTGRES_PASSWORD: "${FUSIONPANEL_PG_PASSWORD:-e2e-pg-admin}"
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    logging: *sprint6-logging

  minio:
    image: ghcr.io/coollabsio/minio:latest
    command: ["server", "/data"]
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.50
    pids_limit: 128
    environment:
      MINIO_ROOT_USER: "${FUSIONPANEL_S6_MINIO_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${FUSIONPANEL_S6_MINIO_PASS:-minioadmin123}"
    tmpfs:
      - /data:rw,noexec,nosuid,nodev,size=128m
    ports:
      - "127.0.0.1::9000"
    healthcheck:
      test: ["CMD-SHELL", "mc alias set local http://127.0.0.1:9000 \"$MINIO_ROOT_USER\" \"$MINIO_ROOT_PASSWORD\" >/dev/null 2>&1"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    logging: *sprint6-logging

  api:
    image: "${FUSIONPANEL_S6_API_IMAGE:?set API image}"
    build:
      context: "${FUSIONPANEL_S6_API_BUILD_CONTEXT:?set API context}"
      dockerfile: Dockerfile
    init: true
    read_only: true
    user: "${FUSIONPANEL_S6_UID:?set UID}:${FUSIONPANEL_S6_GID:?set GID}"
    network_mode: service:node
    depends_on:
      node:
        condition: service_started
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
      - /state:rw,noexec,nosuid,nodev,size=64m,uid=${FUSIONPANEL_S6_UID:?set UID},gid=${FUSIONPANEL_S6_GID:?set GID},mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 0.50
    pids_limit: 128
    environment:
      FUSIONPANEL_ADMIN_TOKEN: "${FUSIONPANEL_E2E_ADMIN_TOKEN:?set admin token}"
      FUSIONPANEL_DATABASE_URL: /state/fusionpanel.db
      FUSIONPANEL_E2E_USERNAME: "${FUSIONPANEL_E2E_USERNAME:-e2e-admin}"
      FUSIONPANEL_E2E_PASSWORD: "${FUSIONPANEL_E2E_PASSWORD:?set password}"
      FUSIONPANEL_FRONTEND_DIR: /app/frontend
      FUSIONPANEL_LISTEN: 0.0.0.0:8080
      FUSIONPANEL_PG_PUBLIC_HOST: postgres
    volumes:
      - "${FUSIONPANEL_S6_REPO_ROOT}/target/debug/fusionpanel-api:/usr/local/bin/fusionpanel-api:ro"
      - "${FUSIONPANEL_S6_REPO_ROOT}/target/debug/fusionpanel-cli:/usr/local/bin/fusionpanel-cli:ro"
      - "${FUSIONPANEL_S6_REPO_ROOT}/frontend/dist:/app/frontend:ro"
    healthcheck:
      test: ["CMD", "/usr/local/bin/fusionpanel-cli", "--server", "http://127.0.0.1:8080", "health"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    logging: *sprint6-logging

  node:
    image: "${FUSIONPANEL_S6_NODE_IMAGE:?set node image}"
    build:
      context: "${FUSIONPANEL_S6_NODE_BUILD_CONTEXT:?set node context}"
      dockerfile: Dockerfile
    init: true
    read_only: true
    user: "0:2000"
    group_add:
      - "33"
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.75
    pids_limit: 192
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
      - /run:rw,noexec,nosuid,nodev,size=8m,uid=0,gid=2000,mode=0750
      - /etc/nginx/fusionpanel:rw,noexec,nosuid,nodev,size=16m,uid=0,gid=0,mode=0750
      - /var/cache/nginx:rw,noexec,nosuid,nodev,size=16m,uid=33,gid=33,mode=0700
      - /var/lib/nginx:rw,noexec,nosuid,nodev,size=16m,uid=33,gid=33,mode=0755
      - /var/backups/fusionpanel:rw,noexec,nosuid,nodev,size=64m,uid=2001,gid=2001,mode=0750
    ports:
      - "127.0.0.1::80"
      - "127.0.0.1::8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      FUSIONPANEL_AGENT_MODE: http
      FUSIONPANEL_API_URL: http://127.0.0.1:8080
      FUSIONPANEL_ADMIN_TOKEN: "${FUSIONPANEL_E2E_ADMIN_TOKEN}"
      FUSIONPANEL_NODE_NAME: "sprint6-${FUSIONPANEL_S6_SUFFIX:?set suffix}"
      FUSIONPANEL_NGINX_CONFIG: /etc/nginx/nginx.conf
      FUSIONPANEL_NGINX_MANAGED_ROOT: /etc/nginx/fusionpanel
      FUSIONPANEL_NGINX_HELPER_SOCKET: /run/fusionpanel-nginx/nginx-helper.sock
      FUSIONPANEL_S6_AGENT_UID: "2001"
      FUSIONPANEL_S6_AGENT_GID: "2001"
      FUSIONPANEL_PG_HOST: postgres
      FUSIONPANEL_PG_PORT: "5432"
      FUSIONPANEL_PG_USER: postgres
      FUSIONPANEL_PG_PASSWORD: "${FUSIONPANEL_PG_PASSWORD:-e2e-pg-admin}"
    volumes:
      - "${FUSIONPANEL_S6_REPO_ROOT}/crates/agent/target/debug/fusionpanel-agent:/usr/local/bin/fusionpanel-agent:ro"
      - "${FUSIONPANEL_S6_REPO_ROOT}/crates/agent/target/debug/fusionpanel-nginx-helper:/usr/local/bin/fusionpanel-nginx-helper:ro"
      - "${FUSIONPANEL_S6_SITES_DIR:?set sites dir}:/srv/fusionpanel/sites:rw"
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    logging: *sprint6-logging
