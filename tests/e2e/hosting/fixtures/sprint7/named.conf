key "rndc-key" {
    algorithm hmac-sha256;
    secret "c3ByaW50Ny1lMmUtdGVzdC1ybmRjLWtleS0xMjM0NTY=";
};

controls {
    inet 0.0.0.0 port 953 allow { any; } keys { "rndc-key"; };
};

options {
    directory "/var/cache/bind";
    listen-on { any; };
    listen-on-v6 { none; };
    allow-query { any; };
    recursion no;
    dnssec-validation no;
};

include "/etc/bind/fusionpanel/named.conf.fusionpanel";
