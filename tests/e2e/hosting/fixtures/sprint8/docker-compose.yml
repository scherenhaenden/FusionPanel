x-sprint8-logging: &sprint8-logging
  driver: local
  options:
    max-size: "2m"
    max-file: "2"

services:
  api:
    image: "${FUSIONPANEL_S8_API_IMAGE:?set API image}"
    build:
      context: "${FUSIONPANEL_S8_API_BUILD_CONTEXT:?set API context}"
      dockerfile: Dockerfile
    init: true
    read_only: true
    user: "${FUSIONPANEL_S8_UID:?set UID}:${FUSIONPANEL_S8_GID:?set GID}"
    network_mode: service:node
    depends_on:
      node:
        condition: service_started
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
      - /state:rw,noexec,nosuid,nodev,size=64m,uid=${FUSIONPANEL_S8_UID:?set UID},gid=${FUSIONPANEL_S8_GID:?set GID},mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 0.50
    pids_limit: 128
    environment:
      FUSIONPANEL_ADMIN_TOKEN: "${FUSIONPANEL_E2E_ADMIN_TOKEN:?set admin token}"
      FUSIONPANEL_DATABASE_URL: /state/fusionpanel.db
      FUSIONPANEL_E2E_USERNAME: "${FUSIONPANEL_E2E_USERNAME:-e2e-admin}"
      FUSIONPANEL_E2E_PASSWORD: "${FUSIONPANEL_E2E_PASSWORD:?set password}"
      FUSIONPANEL_FRONTEND_DIR: /app/frontend
      FUSIONPANEL_LISTEN: 0.0.0.0:8080
    volumes:
      - "${FUSIONPANEL_S8_REPO_ROOT}/target/debug/fusionpanel-api:/usr/local/bin/fusionpanel-api:ro"
      - "${FUSIONPANEL_S8_REPO_ROOT}/target/debug/fusionpanel-cli:/usr/local/bin/fusionpanel-cli:ro"
      - "${FUSIONPANEL_S8_REPO_ROOT}/frontend/dist:/app/frontend:ro"
      - "${FUSIONPANEL_S8_SITES_DIR:?set sites dir}:/srv/fusionpanel/sites:rw"
    healthcheck:
      test: ["CMD", "/usr/local/bin/fusionpanel-cli", "--server", "http://127.0.0.1:8080", "health"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    logging: *sprint8-logging

  node:
    image: "${FUSIONPANEL_S8_NODE_IMAGE:?set node image}"
    build:
      context: "${FUSIONPANEL_S8_NODE_BUILD_CONTEXT:?set node context}"
      dockerfile: Dockerfile
    init: true
    read_only: true
    user: "0:2000"
    group_add:
      - "33"
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.75
    pids_limit: 192
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
      - /run:rw,noexec,nosuid,nodev,size=8m,uid=0,gid=2000,mode=0750
      - /etc/nginx/fusionpanel:rw,noexec,nosuid,nodev,size=16m,uid=0,gid=0,mode=0750
      - /var/cache/nginx:rw,noexec,nosuid,nodev,size=16m,uid=33,gid=33,mode=0700
      - /var/lib/nginx:rw,noexec,nosuid,nodev,size=16m,uid=33,gid=33,mode=0755
    ports:
      - "127.0.0.1::80"
      - "127.0.0.1::8080"
    environment:
      FUSIONPANEL_AGENT_MODE: http
      FUSIONPANEL_API_URL: http://127.0.0.1:8080
      FUSIONPANEL_ADMIN_TOKEN: "${FUSIONPANEL_E2E_ADMIN_TOKEN}"
      FUSIONPANEL_NODE_NAME: "sprint8-${FUSIONPANEL_S8_SUFFIX:?set suffix}"
      FUSIONPANEL_NGINX_CONFIG: /etc/nginx/nginx.conf
      FUSIONPANEL_NGINX_MANAGED_ROOT: /etc/nginx/fusionpanel
      FUSIONPANEL_NGINX_HELPER_SOCKET: /run/fusionpanel-nginx/nginx-helper.sock
      FUSIONPANEL_CRON_DIR: /tmp/fusionpanel-cron.d
      FUSIONPANEL_CRON_USER: www-data
      FUSIONPANEL_S8_AGENT_UID: "2001"
      FUSIONPANEL_S8_AGENT_GID: "2001"
    volumes:
      - "${FUSIONPANEL_S8_REPO_ROOT}/crates/agent/target/debug/fusionpanel-agent:/usr/local/bin/fusionpanel-agent:ro"
      - "${FUSIONPANEL_S8_REPO_ROOT}/crates/agent/target/debug/fusionpanel-nginx-helper:/usr/local/bin/fusionpanel-nginx-helper:ro"
      - "${FUSIONPANEL_S8_SITES_DIR:?set sites dir}:/srv/fusionpanel/sites:rw"
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    logging: *sprint8-logging
