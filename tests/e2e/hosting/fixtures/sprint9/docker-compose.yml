x-sprint9-logging: &sprint9-logging
  driver: local
  options:
    max-size: "2m"
    max-file: "2"

services:
  api:
    image: "${FUSIONPANEL_S9_API_IMAGE:?set API image}"
    build:
      context: "${FUSIONPANEL_S9_API_BUILD_CONTEXT:?set API context}"
      dockerfile: Dockerfile
    init: true
    read_only: true
    user: "${FUSIONPANEL_S9_UID:?set UID}:${FUSIONPANEL_S9_GID:?set GID}"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
      - /state:rw,noexec,nosuid,nodev,size=64m,uid=${FUSIONPANEL_S9_UID:?set UID},gid=${FUSIONPANEL_S9_GID:?set GID},mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 0.50
    pids_limit: 128
    ports:
      - "127.0.0.1::8080"
    environment:
      FUSIONPANEL_ADMIN_TOKEN: "${FUSIONPANEL_E2E_ADMIN_TOKEN:?set admin token}"
      FUSIONPANEL_DATABASE_URL: /state/fusionpanel.db
      FUSIONPANEL_E2E_USERNAME: "${FUSIONPANEL_E2E_USERNAME:-e2e-admin}"
      FUSIONPANEL_E2E_PASSWORD: "${FUSIONPANEL_E2E_PASSWORD:?set password}"
      FUSIONPANEL_FRONTEND_DIR: /app/frontend
      FUSIONPANEL_LISTEN: 0.0.0.0:8080
    volumes:
      - "${FUSIONPANEL_S9_REPO_ROOT}/target/debug/fusionpanel-api:/usr/local/bin/fusionpanel-api:ro"
      - "${FUSIONPANEL_S9_REPO_ROOT}/target/debug/fusionpanel-cli:/usr/local/bin/fusionpanel-cli:ro"
      - "${FUSIONPANEL_S9_REPO_ROOT}/frontend/dist:/app/frontend:ro"
    healthcheck:
      test: ["CMD", "/usr/local/bin/fusionpanel-cli", "--server", "http://127.0.0.1:8080", "health"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    logging: *sprint9-logging
