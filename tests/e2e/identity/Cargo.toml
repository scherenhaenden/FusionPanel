[package]
name = "e2e-identity"
version = "0.1.0-dev.1"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

# Isolated workspace
[workspace]

[[test]]
name = "cli_identity_test"
path = "cli_identity_test.rs"

[dependencies]
identity = { path = "../../../modules/identity" }
fusionpanel-domain = { path = "../../../crates/domain" }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.7", features = ["v4"] }
tempfile = "3.8"
chrono = "0.4"
