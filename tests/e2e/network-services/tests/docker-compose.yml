services:
  bind9:
    image: ubuntu/bind9:9.18-22.04_beta
    environment:
      - BIND9_USER=root
    ports:
      - target: 53
        protocol: udp
        host_ip: 127.0.0.1
      - target: 53
        protocol: tcp
        host_ip: 127.0.0.1
    command: ["-u", "bind", "-g", "-c", "/etc/bind/named.conf"]

  mailserver:
    image: tvial/docker-mailserver:latest
    hostname: mail
    domainname: example.com
    environment:
      - DMS_DEBUG=0
      - ENABLE_SPAMASSASSIN=0
      - ENABLE_CLAMAV=0
      - ENABLE_FAIL2BAN=0
      - ENABLE_POSTGREY=0
      - ENABLE_SASLAUTHD=0
      - ONE_DIR=1
      - POSTMASTER_ADDRESS=postmaster@example.com
    volumes:
      - ./config:/tmp/docker-mailserver
    ports:
      - target: 25
        protocol: tcp
        host_ip: 127.0.0.1
      - target: 143
        protocol: tcp
        host_ip: 127.0.0.1
      - target: 587
        protocol: tcp
        host_ip: 127.0.0.1
