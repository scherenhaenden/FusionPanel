version: '3.8'

services:
  bind9:
    image: ubuntu/bind9:9.18-22.04_beta
    environment:
      - BIND9_USER=root
    ports:
      - "5353:53/udp"
      - "5353:53/tcp"
    command: ["-u", "bind", "-g", "-c", "/etc/bind/named.conf"]

  mailserver:
    image: tvial/docker-mailserver:latest
    hostname: mail
    domainname: example.com
    environment:
      - DMS_DEBUG=0
      - ENABLE_SPAMASSASSIN=0
      - ENABLE_CLAMAV=0
      - ENABLE_FAIL2BAN=0
      - ENABLE_POSTGREY=0
      - ENABLE_SASLAUTHD=0
      - ONE_DIR=1
      - POSTMASTER_ADDRESS=postmaster@example.com
    ports:
      - "2525:25"
      - "1433:143"
      - "5877:587"
