[workspace]
members = ["."]

[package]
name = "variants-e2e"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[dependencies]
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["full", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[test]]
name = "qualification"
path = "tests/qualification.rs"
