services:
  postgres:
    image: postgres:15-alpine@sha256:54e0dd8e8cddcdbb9156c2486eed5a43eccb7214d7c6828097d41ce049fb3984
    environment:
      POSTGRES_USER: fp_user
      POSTGRES_PASSWORD: ${FP_TEST_POSTGRES_PASSWORD:?Run tests/fixtures/compose.py up to create disposable credentials}
      POSTGRES_DB: fp_db
    ports:
      - "127.0.0.1:${FP_TEST_POSTGRES_PORT:-}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fp_user -d fp_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  mariadb:
    image: mariadb:10.11@sha256:d769e37960821dfdcf096954f6e7ac89f747e116c1bba98e48edd265dfc7deae
    environment:
      MYSQL_ROOT_PASSWORD: ${FP_TEST_MARIADB_ROOT_PASSWORD:?Run tests/fixtures/compose.py up to create disposable credentials}
      MYSQL_USER: fp_user
      MYSQL_PASSWORD: ${FP_TEST_MARIADB_PASSWORD:?Run tests/fixtures/compose.py up to create disposable credentials}
      MYSQL_DATABASE: fp_db
    ports:
      - "127.0.0.1:${FP_TEST_MARIADB_PORT:-}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--su-mysql", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine@sha256:785835ea65db4bba6f021acc0f3be91b0fef76a53fe41f8588c6698d2aed0606
    volumes:
      - ./nginx/index.html:/usr/share/nginx/html/index.html:ro
    ports:
      - "127.0.0.1:${FP_TEST_NGINX_PORT:-}:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: ghcr.io/coollabsio/minio:latest@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: fp_admin
      MINIO_ROOT_PASSWORD: ${FP_TEST_MINIO_PASSWORD:?Run tests/fixtures/compose.py up to create disposable credentials}
    ports:
      - "127.0.0.1:${FP_TEST_MINIO_PORT:-}:9000"
      - "127.0.0.1:${FP_TEST_MINIO_CONSOLE_PORT:-}:9001"
